<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<style>body{background:var(--bg);font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink);padding:28px;margin:0}.demo{max-width:940px;margin:0 auto}.demo h2{font-family:"Fraunces",serif;color:var(--accent-strong);font-size:20px;margin:0 0 6px}.demo p.lede{color:var(--ink-faint);margin:0 0 22px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}</style>
</head><body><div class="demo">
<h2>Buttons</h2><p class="lede">Primary = .btn.btn-primary (teal, often with a leading line icon). Segmented tabs = .locbtn (.on active). Quiet = .signout. Icon button = .menu-btn.</p>
<div class="row">
  <button class="btn btn-primary"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 20h14"/></svg> Download Excel</button>
  <button class="signout">Sign out</button>
  <button class="menu-btn" style="display:inline-flex"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
</div>
<div class="row">
  <button class="locbtn on">All</button>
  <button class="locbtn">Crace</button>
  <button class="locbtn">Denman</button>
  <button class="locbtn">Lyneham</button>
</div>
</div></body></html>
