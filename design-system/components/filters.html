<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<style>body{background:var(--bg);font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink);padding:28px;margin:0}.demo{max-width:940px;margin:0 auto}.demo h2{font-family:"Fraunces",serif;color:var(--accent-strong);font-size:20px;margin:0 0 6px}.demo p.lede{color:var(--ink-faint);margin:0 0 22px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}</style>
</head><body><div class="demo">
<h2>Filters</h2><p class="lede">.filters row of .fgrp. Each .fgrp has a .flbl label and a control: date .dinput, search .sinput, or a select in .selwrap. On mobile the row becomes a 2-column grid.</p>
<div class="filters">
  <div class="fgrp"><span class="flbl">From</span><input class="dinput" type="date" value="2026-01-05"></div>
  <div class="fgrp"><span class="flbl">To</span><input class="dinput" type="date" value="2026-07-10"></div>
  <div class="fgrp inv"><span class="flbl">Invoice #</span><input class="sinput" type="text" placeholder="Search invoices"></div>
  <div class="fgrp"><span class="flbl">Status</span><div class="selwrap"><select><option>All</option><option>Paid</option><option>Unpaid</option></select></div></div>
  <div class="fgrp"><span class="flbl">Bucket group</span><div class="selwrap"><select><option>All</option><option>Current (0–30 days)</option><option>31–60 days</option><option>61–90 days</option><option>91+ days</option></select></div></div>
  <div class="fgrp"><span class="flbl">Category</span><div class="selwrap"><select><option>All</option><option>Workers Compensation</option><option>Private – Skin</option></select></div></div>
</div>
</div></body></html>
