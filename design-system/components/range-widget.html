<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

</head><body><div class="demo">
<h2>Range widget (low → high with marker)</h2><p class="lede">.rng lays out a low value, a .rng-track with a .rng-fill and a donut .rng-mark for the current position, and a high value. Used in the Movement tables.</p>
<div class="panel" style="max-width:420px">
  <div class="rng"><span class="rng-v">$114,910</span><div class="rng-track"><div class="rng-fill" style="width:34%"></div><div class="rng-mark" style="left:34%"></div></div><span class="rng-v">$272,470</span></div>
  <div style="height:14px"></div>
  <div class="rng"><span class="rng-v">$44,445</span><div class="rng-track"><div class="rng-fill" style="width:6%"></div><div class="rng-mark" style="left:6%"></div></div><span class="rng-v">$112,673</span></div>
</div>
</div></body></html>
